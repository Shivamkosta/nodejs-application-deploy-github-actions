name: Deploy Node App to Heroku

on:
push:
branches:
- master

jobs:
deploy:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout code
    uses: actions/checkout@v3

  - name: Setup Node.js
    uses: actions/setup-node@v3
    with:
      node-version: '22'

  - name: Install dependencies
    run: npm install

  - name: Run tests
    run: npm test

